<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% 35%, #cfeaa8 0%, #87c784 45%, #468c56 80%, #295b36 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient glow that shifts */
    .ambient-glow {
      position: absolute;
      width: 950px;
      height: 950px;
      background: radial-gradient(circle, rgba(215, 255, 185, 0.45) 0%, rgba(100, 205, 140, 0.25) 50%, transparent 75%);
      filter: blur(90px);
      z-index: 1;
      pointer-events: none;
    }

    /* Camera Stage (Smooth 3D/Zoom Transform Container) */
    .camera-stage {
      position: relative;
      z-index: 10;
      width: 1080px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* iPhone Frame */
    .iphone-frame {
      position: relative;
      width: 630px;
      height: 980px;
      background: #7ca17a; /* Sage green titanium */
      border-radius: 68px;
      padding: 12px;
      box-shadow: 
        0 0 0 3px rgba(255, 255, 255, 0.4),
        0 40px 100px -20px rgba(0, 0, 0, 0.5),
        0 20px 50px -10px rgba(0, 0, 0, 0.35),
        inset 0 0 5px 3px rgba(255, 255, 255, 0.3);
    }

    /* Inner Screen */
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #e3ece2;
      border-radius: 56px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 13px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 38px;
      background: #000000;
      border-radius: 22px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .island-camera {
      width: 13px;
      height: 13px;
      background: #0c1421;
      border-radius: 50%;
      border: 1.5px solid #1c2638;
      margin-left: auto;
    }

    .dynamic-island.expanded {
      width: 480px;
      height: 64px;
      border-radius: 32px;
      padding: 10px 22px;
      background: rgba(14, 18, 22, 0.98);
      box-shadow: 0 15px 35px rgba(0,0,0,0.55);
    }

    .island-content {
      display: none;
      width: 100%;
      align-items: center;
      gap: 14px;
      color: #ffffff;
    }

    .dynamic-island.expanded .island-content {
      display: flex;
    }

    .island-icon {
      font-size: 28px;
    }

    .island-text {
      flex: 1;
    }

    .island-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .island-desc {
      font-size: 13px;
      color: #9eb1a2;
      margin-top: 1px;
    }

    /* iOS Status Bar */
    .status-bar {
      height: 56px;
      padding: 18px 36px 0 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 17px;
      font-weight: 700;
      color: #000000;
      z-index: 90;
      background: rgba(246, 248, 246, 0.9);
      backdrop-filter: blur(20px);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Telegram Top Bar */
    .tg-header {
      height: 68px;
      background: rgba(246, 248, 246, 0.9);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.12);
      z-index: 80;
    }

    .tg-back {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.05);
      color: #007aff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tg-back svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tg-user-capsule {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 42px;
      gap: 12px;
    }

    .tg-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #42e695 0%, #3bb2b8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #ffffff;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .tg-names {
      text-align: left;
    }

    .tg-name {
      font-size: 18px;
      font-weight: 700;
      color: #000000;
      line-height: 1.2;
    }

    .tg-status {
      font-size: 13px;
      color: #007aff;
      font-weight: 600;
    }

    /* Telegram Chat Canvas with Doodle Wallpaper */
    .tg-chat {
      flex: 1;
      position: relative;
      background-color: #dbe7da;
      background-image: 
        radial-gradient(#c7dac6 1.8px, transparent 1.8px),
        radial-gradient(#c7dac6 1.8px, #dbe7da 1.8px);
      background-size: 26px 26px;
      background-position: 0 0, 13px 13px;
      padding: 18px 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Message Rows */
    .msg-row {
      display: flex;
      width: 100%;
      opacity: 0;
      transform: translateY(18px) scale(0.94);
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .msg-row.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .msg-row.in {
      justify-content: flex-start;
    }

    .msg-row.out {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 86%;
      padding: 14px 20px 12px 20px;
      font-size: 20px;
      line-height: 1.4;
      position: relative;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      word-break: break-word;
    }

    .bubble.in {
      background: #ffffff;
      color: #000000;
      border-radius: 24px 24px 24px 8px;
    }

    .bubble.out {
      background: #e2f7cb;
      color: #000000;
      border-radius: 24px 24px 8px 24px;
      transition: background 0.3s ease, box-shadow 0.4s ease, transform 0.3s ease;
    }

    .bubble-meta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      color: #648260;
      float: right;
      margin-left: 14px;
      margin-top: 6px;
    }

    .bubble.in .bubble-meta {
      color: #8e8e93;
    }

    .checkmarks {
      display: inline-flex;
      color: #34b7f1;
    }

    /* Card Morph Container */
    .card-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px 0;
    }

    .card-bank {
      font-weight: 700;
      color: #174c2d;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-num {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
      color: #0c3d1f;
      letter-spacing: 0.8px;
      background: rgba(0,0,0,0.06);
      padding: 6px 12px;
      border-radius: 10px;
      margin: 2px 0;
    }

    .card-holder {
      font-size: 15px;
      color: #3b6641;
      font-weight: 600;
    }

    /* Flash highlight */
    .bubble.out.flash {
      box-shadow: 0 0 0 6px rgba(66, 230, 149, 0.6), 0 0 35px rgba(66, 230, 149, 0.7);
      background: #d4f4b8;
      transform: scale(1.03);
    }

    /* Telegram Bottom Bar */
    .tg-bottom {
      background: #f6f8f6;
      padding: 12px 18px 32px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-top: 0.5px solid rgba(0, 0, 0, 0.12);
      z-index: 80;
    }

    .attach-icon {
      color: #8e8e93;
      display: flex;
      align-items: center;
    }

    .input-box {
      flex: 1;
      background: #ffffff;
      border-radius: 26px;
      height: 50px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      border: 0.5px solid rgba(0, 0, 0, 0.15);
      font-size: 19px;
    }

    .input-ph {
      color: #8e8e93;
    }

    .input-val {
      color: #000000;
      font-weight: 700;
    }

    .input-pipe {
      display: inline-block;
      width: 2.5px;
      height: 24px;
      background: #007aff;
      margin-left: 2px;
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #007aff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(0, 122, 255, 0.4);
      transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .send-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .send-btn.tap {
      transform: scale(0.82);
      background: #005bb5;
    }

    /* Home Bar */
    .home-bar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 5px;
      background: #000000;
      border-radius: 3px;
      z-index: 100;
    }

    /* Touch Pointer (Frosted glass circle like in Guardian Bots.mp4) */
    .touch-ring {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      border: 3.5px solid rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .touch-ring.down {
      transform: translate(-50%, -50%) scale(0.72);
      background: rgba(255, 255, 255, 0.75);
    }

    /* Floating branding badge at bottom */
    .floating-badge {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      padding: 10px 24px;
      border-radius: 30px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 30;
      pointer-events: none;
    }

    .floating-badge.visible {
      opacity: 1;
    }

    .badge-dot {
      width: 10px;
      height: 10px;
      background: #1aff80;
      border-radius: 50%;
      box-shadow: 0 0 10px #1aff80;
    }
  </style>
</head>
<body>

  <div class="ambient-glow" id="ambientGlow"></div>

  <!-- Camera Stage Container for Smooth Zooms and Pans -->
  <div class="camera-stage" id="cameraStage">

    <div class="iphone-frame">
      <div class="screen">
        
        <!-- Touch pointer -->
        <div class="touch-ring" id="touchRing"></div>

        <!-- Dynamic Island -->
        <div class="dynamic-island" id="island">
          <div class="island-content">
            <div class="island-icon">⚡️</div>
            <div class="island-text">
              <div class="island-title">SeenSPY Tezkor Javob</div>
              <div class="island-desc">.card buyrug'i bir zumda to'ldirildi</div>
            </div>
          </div>
          <div class="island-camera"></div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
          <span>9:41</span>
          <div class="status-icons">
            <svg width="18" height="12" viewBox="0 0 17 11" fill="currentColor">
              <rect x="0" y="8" width="3" height="3" rx="0.5"/>
              <rect x="4.5" y="5.5" width="3" height="5.5" rx="0.5"/>
              <rect x="9" y="3" width="3" height="8" rx="0.5"/>
              <rect x="13.5" y="0" width="3" height="11" rx="0.5"/>
            </svg>
            <svg width="16" height="12" viewBox="0 0 15 11" fill="currentColor">
              <path d="M7.5 2.5C9.8 2.5 11.9 3.4 13.5 4.9L14.7 3.7C12.8 1.9 10.3 0.8 7.5 0.8C4.7 0.8 2.2 1.9 0.3 3.7L1.5 4.9C3.1 3.4 5.2 2.5 7.5 2.5ZM7.5 6C9 6 10.4 6.6 11.4 7.6L12.6 6.4C11.3 5.1 9.5 4.3 7.5 4.3C5.5 4.3 3.7 5.1 2.4 6.4L3.6 7.6C4.6 6.6 6 6 7.5 6ZM7.5 9.5C8.3 9.5 9 10.2 9 11H6C6 10.2 6.7 9.5 7.5 9.5Z"/>
            </svg>
            <svg width="25" height="12" viewBox="0 0 24 11" fill="currentColor">
              <rect x="1" y="1" width="19" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/>

        <!-- Telegram Header -->
        <div class="tg-header">

          <div class="tg-user-capsule">

              <div class="tg-name">Sardor (Mijoz)</div>
              <div class="tg-status">online</div>

          </div>

        <!-- Chat Canvas -->
        <div class="tg-chat">
          
          <!-- Msg 1: Client question -->
          <div class="msg-row in visible" id="row1">
            <div class="bubble in">
              Salom! Karta raqamingizni yubora olasizmi? To'lov qilib berardim.
              <span class="bubble-meta">9:40</span>
            </div>
          </div>

          <!-- Msg 2: .card quick reply -->
          <div class="msg-row out" id="row2">
            <div class="bubble out" id="bubble2">
              <div id="content2">.card</div>
              <span class="bubble-meta">
                <span>9:41</span>
                <span class="checkmarks" id="checks2">
                  <svg width="16" height="12" viewBox="0 0 16 11" fill="none">
                    <path d="M1 5.5L5 9.5L15 1.5" stroke="#34b7f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>

        <!-- Bottom Bar -->
        <div class="tg-bottom">

              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>

  </div>

  <!-- Floating branding badge -->
  <div class="floating-badge" id="floatingBadge">
    <div class="badge-dot"></div>
    <span>SeenSPY BOT • Tezkor javoblar (.card)</span>
  </div>

  <script>
    // Smooth easing helper functions
    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function easeInOutCubic(edge0, edge1, x) {
      let t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // Deterministic seek function for frame-by-frame rendering with DYNAMIC CAMERA
    window.seek = function(t) {
      const cameraStage = document.getElementById('cameraStage');
      const ambientGlow = document.getElementById('ambientGlow');
      const touchRing = document.getElementById('touchRing');
      const island = document.getElementById('island');
      const row1 = document.getElementById('row1');
      const row2 = document.getElementById('row2');
      const row3 = document.getElementById('row3');
      const bubble2 = document.getElementById('bubble2');
      const content2 = document.getElementById('content2');
      const checks2 = document.getElementById('checks2');
      const inputPh = document.getElementById('inputPh');
      const inputVal = document.getElementById('inputVal');
      const inputPipe = document.getElementById('inputPipe');
      const sendBtn = document.getElementById('sendBtn');
      const floatingBadge = document.getElementById('floatingBadge');

      // -------------------------------------------------------------
      // 1. DYNAMIC CAMERA CONTROLLER (Smooth Zoom In / Out / Pan)
      // -------------------------------------------------------------
      let camScale = 1.0;
      let camY = 0;
      let camRot = 0;

      if (t < 0.7) {
        // Wide establishing shot
        camScale = 1.0;
        camY = 0;
        camRot = 0;
      } else if (t < 1.6) {
        // Smooth zoom in into input bar at bottom
        const p = easeInOutCubic(0.7, 1.6, t);
        camScale = lerp(1.0, 1.32, p);
        camY = lerp(0, -155, p);
        camRot = lerp(0, -0.6, p);
      } else if (t < 3.0) {
        // Hold close-up on typing and send
        const p = smoothstep(1.6, 3.0, t);
        camScale = lerp(1.32, 1.34, p);
        camY = lerp(-155, -165, p);
        camRot = lerp(-0.6, -0.3, p);
      } else if (t < 4.0) {
        // Pan smoothly up to the message bubble during send & morph
        const p = easeInOutCubic(3.0, 4.0, t);
        camScale = lerp(1.34, 1.36, p);
        camY = lerp(-165, -60, p);
        camRot = lerp(-0.3, 0.4, p);
      } else if (t < 5.2) {
        // Hold on morphed card bubble & dynamic island
        const p = smoothstep(4.0, 5.2, t);
        camScale = lerp(1.36, 1.25, p);
        camY = lerp(-60, -25, p);
        camRot = lerp(0.4, 0.1, p);
      } else if (t < 6.4) {
        // Smoothly pull back to wide shot
        const p = easeInOutCubic(5.2, 6.4, t);
        camScale = lerp(1.25, 1.0, p);
        camY = lerp(-25, 0, p);
        camRot = lerp(0.1, 0, p);
      } else {
        // Wide beauty shot
        camScale = 1.0;
        camY = 0;
        camRot = 0;
      }

      cameraStage.style.transform = `scale(${camScale.toFixed(4)}) translateY(${camY.toFixed(2)}px) rotate(${camRot.toFixed(3)}deg)`;

      // Floating badge appears during wide shot at end
      floatingBadge.classList.toggle('visible', t >= 6.2);

      // -------------------------------------------------------------
      // 2. CHAT & MESSAGE ANIMATIONS
      // -------------------------------------------------------------
      row1.classList.add('visible');
      row2.classList.toggle('visible', t >= 3.2);
      row3.classList.toggle('visible', t >= 4.8);
      island.classList.toggle('expanded', t >= 3.7 && t < 6.2);

      // Typing simulation in input field
      if (t < 1.1) {
        inputPh.style.display = 'inline';
        inputVal.textContent = '';
        inputPipe.style.display = 'none';
      } else if (t < 1.4) {
        inputPh.style.display = 'none';
        inputVal.textContent = '';
        inputPipe.style.display = 'inline-block';
      } else if (t < 1.7) {
        inputPh.style.display = 'none';
        inputVal.textContent = '.';
        inputPipe.style.display = 'inline-block';
      } else if (t < 1.95) {
        inputPh.style.display = 'none';
        inputVal.textContent = '.c';
        inputPipe.style.display = 'inline-block';
      } else if (t < 2.2) {
        inputPh.style.display = 'none';
        inputVal.textContent = '.ca';
        inputPipe.style.display = 'inline-block';
      } else if (t < 2.45) {
        inputPh.style.display = 'none';
        inputVal.textContent = '.car';
        inputPipe.style.display = 'inline-block';
      } else if (t < 3.0) {
        inputPh.style.display = 'none';
        inputVal.textContent = '.card';
        inputPipe.style.display = 'inline-block';
      } else {
        inputPh.style.display = 'inline';
        inputVal.textContent = '';
        inputPipe.style.display = 'none';
      }

      // Send Button state
      if (t >= 2.95 && t < 3.15) {
        sendBtn.classList.add('tap');
      } else {
        sendBtn.classList.remove('tap');
      }

      // Card bubble content & morph
      if (t < 3.7) {
        bubble2.classList.remove('flash');
        content2.innerHTML = '.card';
        checks2.innerHTML = `
          <svg width="16" height="12" viewBox="0 0 16 11" fill="none">
            <path d="M1 5.5L5 9.5L15 1.5" stroke="#34b7f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
      } else {
        if (t < 4.4) {
          bubble2.classList.add('flash');
        } else {
          bubble2.classList.remove('flash');
        }
        content2.innerHTML = `
          <div class="card-box">
            <div class="card-bank">💳 <b>Kapitalbank UZCARD</b></div>
            <div class="card-num">8600 1234 5678 9010</div>
            <div class="card-holder">Ali V.</div>
          </div>
        `;
        checks2.innerHTML = `
          <svg width="19" height="12" viewBox="0 0 19 11" fill="none">
            <path d="M1 5.5L5 9.5L15 1.5" stroke="#34b7f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 5.5L9 9.5L19 1.5" stroke="#34b7f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
      }

      // -------------------------------------------------------------
      // 3. TOUCH POINTER ANIMATION
      // -------------------------------------------------------------
      if (t >= 0.8 && t < 1.3) {
        // Move to input
        const progress = Math.min(1, (t - 0.8) / 0.5);
        const ease = easeInOutCubic(0, 1, progress);
        const x = 380 + (280 - 380) * ease;
        const y = 960 + (910 - 960) * ease;
        touchRing.style.opacity = Math.min(1, (t - 0.8) / 0.25);
        touchRing.style.left = x + 'px';
        touchRing.style.top = y + 'px';
        touchRing.classList.toggle('down', t >= 1.15 && t < 1.3);
      } else if (t >= 1.3 && t < 2.5) {
        touchRing.style.opacity = 0;
      } else if (t >= 2.5 && t < 3.2) {
        // Move to send button (x: 560, y: 910)
        const progress = Math.min(1, (t - 2.5) / 0.45);
        const ease = easeInOutCubic(0, 1, progress);
        const x = 280 + (555 - 280) * ease;
        const y = 910;
        touchRing.style.opacity = 1;
        touchRing.style.left = x + 'px';
        touchRing.style.top = y + 'px';
        touchRing.classList.toggle('down', t >= 2.95 && t < 3.15);
      } else {
        touchRing.style.opacity = 0;
      }
    };
  </script>
</body>
</html>
